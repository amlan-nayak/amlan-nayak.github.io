# --- General options --- #

# This is a GitHub user page (amlan-nayak.github.io), so url has no path
# and baseurl is empty.
url: "https://amlan-nayak.github.io"
baseurl: ""

# Name of website
title: Amlan Nayak

# Short description of your site (used in <meta description> and RSS)
description: Computational biology researcher studying animal decision-making, predator-prey interactions, and real-time computer vision.

# --- Navigation bar options --- #

# List of links in the navigation bar
navbar-links:
  Home: ""
  Publications: "publications"
  Talks: "talks"
  CV: "resume"

# Image to show in the navigation bar - image must be a square (width = height)
avatar: "/static/img/amlan_new.jpg"

# --- Author / footer options --- #

author:
  name: Amlan Nayak
  email: "an526@cornell.edu"
  github: amlan-nayak
  twitter: _Amlaa
  ORCID: 0009-0008-0697-2640
  linkedin: amlan-nayak

# This site intentionally runs no analytics, tracking scripts, or ad tech.

# Character used to separate site title and description in HTML document title
title-separator: "-"

# --- Output options (Jekyll internals) --- #

timezone: "America/New_York"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/

kramdown:
  input: GFM

# Default YAML values
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  -
    scope:
      path: "" # all files
    values:
      layout: "page"
      show-avatar: true

# Exclude these files from the production site
exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - EDITING_GUIDE.md
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

plugins:
  - jekyll-sitemap
